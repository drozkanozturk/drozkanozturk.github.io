  <meta charset="UTF-8" />

  <title>Weekly Schedule | Dr. Özkan Öztürk</title>
  <meta name="description" content="Weekly class and meeting schedule of Dr. Özkan Öztürk, Department of Mathematics, Giresun University.">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:#0a0f1e; --navy-mid:#111827; --navy-light:#1e2d45;
      --gold:#c9a84c; --gold-light:#e8c97a; --cream:#f0ead8; --cream-dim:#c8bfa8;
      --steel:#8294a8; --white:#ffffff; --border:rgba(201,168,76,0.25);
      --blue:#7eb8d4;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { background:var(--navy); color:var(--cream); font-family:'Source Serif 4',Georgia,serif; font-weight:300; line-height:1.75; overflow-x:hidden; }

    nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; justify-content:space-between; align-items:center; padding:1.1rem 3rem; background:rgba(10,15,30,0.88); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-logo { font-family:'Playfair Display',serif; font-size:1rem; color:var(--gold); letter-spacing:0.05em; text-decoration:none; white-space:nowrap; }
    .nav-links { display:flex; gap:1.6rem; list-style:none; flex-wrap:wrap; justify-content:flex-end; }
    .nav-links a { font-family:'JetBrains Mono',monospace; font-size:0.82rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel); text-decoration:none; transition:color 0.25s; white-space:nowrap; }
    .nav-links a:hover, .nav-links a.active { color:var(--gold-light); }

    main { max-width:1300px; margin:0 auto; padding:8rem 4rem 4rem; }
    .section-header { display:flex; align-items:baseline; gap:1.5rem; margin-bottom:1.5rem; }
    .section-title { font-family:'Playfair Display',serif; font-size:2rem; font-weight:600; color:var(--white); }
    .section-line { flex:1; height:1px; background:var(--border); }
    .sub { font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--steel); letter-spacing:0.05em; margin-bottom:2rem; }

    .legend { display:flex; gap:1.5rem; margin-bottom:1.2rem; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--cream-dim); letter-spacing:0.05em; }
    .legend span { display:flex; align-items:center; gap:0.5rem; }
    .dot { width:12px; height:12px; border-left:3px solid var(--gold); background:rgba(201,168,76,0.25); }
    .dot.meet { border-left-color:var(--blue); background:rgba(100,160,200,0.25); }

    .cal { display:grid; grid-template-columns:64px repeat(5,1fr); background:var(--navy-mid); border:1px solid var(--border); }
    .cal-head { padding:0.8rem 0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.85rem; letter-spacing:0.12em; color:var(--gold); border-bottom:1px solid var(--border); }
    .cal-head.today { background:rgba(201,168,76,0.1); }
    .time-col { position:relative; }
    .time-col div { position:absolute; right:8px; transform:translateY(-50%); font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--steel); }
    .day-col { position:relative; border-left:1px solid rgba(201,168,76,0.15); }
    .day-col.today { background:rgba(201,168,76,0.04); }
    .ev { position:absolute; left:3px; right:3px; padding:5px 8px; overflow:hidden; font-size:0.85rem; line-height:1.3; color:var(--gold-light); background:rgba(201,168,76,0.18); border-left:3px solid var(--gold); transition:background 0.2s; }
    .ev:hover { background:rgba(201,168,76,0.3); }
    .ev.meet { color:var(--blue); background:rgba(100,160,200,0.15); border-left-color:var(--blue); }
    .ev.meet:hover { background:rgba(100,160,200,0.28); }
    .ev small { display:block; font-family:'JetBrains Mono',monospace; font-size:0.68rem; opacity:0.8; margin-top:2px; }

    .agenda { display:none; }
    .agenda-day { background:var(--navy-mid); border:1px solid var(--border); border-left:3px solid var(--gold); padding:1rem 1.2rem; margin-bottom:1rem; }
    .agenda-day h3 { font-family:'Playfair Display',serif; font-size:1rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.6rem; }
    .agenda-item { display:grid; grid-template-columns:110px 1fr; gap:0.8rem; padding:0.5rem 0; border-top:1px solid rgba(201,168,76,0.1); font-size:0.95rem; }
    .agenda-item .t { font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--gold); padding-top:2px; }
    .agenda-item.meet .t { color:var(--blue); }

    footer { text-align:center; padding:2.5rem; border-top:1px solid var(--border); font-family:'JetBrains Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; color:var(--steel); }

    @media (max-width:960px) {
      nav { padding:1rem 1.5rem; }
      .nav-links { gap:0.9rem; }
      .nav-links a { font-size:0.6rem; }
      main { padding:10rem 1.5rem 3rem; }
      .cal, .legend-desktop { display:none; }
      .agenda { display:block; }
    }
  </style>
</head>
<body>

  <ul class="nav-links">

    <li><a href="index.html#conferences">Conferences</a></li>
    <li><a href="index.html#seminars">Seminars</a></li>

  </ul>
</nav>

<main>
  <div class="section-header"><h2 class="section-title">Weekly Schedule</h2><div class="section-line"></div></div>
  <p class="sub">Fall 2026 · Department of Mathematics · Giresun University</p>

  <div class="legend">
    <span><i class="dot"></i>Class</span>
    <span><i class="dot meet"></i>Online meeting</span>
  </div>

  <div class="cal" id="cal"></div>
  <div class="agenda" id="agenda"></div>
</main>

<footer>
  <p>Copyright © 2026 Özkan Öztürk, All rights reserved</p>
</footer>

<script>
/* ============================================================
   DERS PROGRAMI: DEĞİŞİKLİK İÇİN SADECE BU LİSTEYİ DÜZENLE
   day  : 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday
   start/end : "HH:MM" (24 saat)
   type : "class" (altın)  veya  "meet" (mavi)
   Bir satırı silersen etkinlik kalkar, yeni satır eklersen çıkar.
   ============================================================ */
const EVENTS = [
  { day:1, start:"08:00", end:"12:00", title:"Differential Equations for Engineers", type:"class" },
  { day:1, start:"12:00", end:"13:00", title:"Advanced Programming I (Python)", type:"class" },
  { day:1, start:"13:00", end:"14:00", title:"Supervised Graduate Research", type:"class" },
  { day:1, start:"14:00", end:"17:00", title:"LaTeX for Graduate Students", type:"class" },

  /* Salı 08:00-12:00 dersinin adını yazıp başındaki // işaretlerini kaldır:
  { day:2, start:"08:00", end:"12:00", title:"Ders adı", type:"class" }, */
  { day:2, start:"12:00", end:"15:00", title:"Advanced Programming I (Python)", type:"class" },
  { day:2, start:"17:30", end:"19:30", title:"Online Research Meeting with Tom and Nick", type:"meet" },

  { day:4, start:"17:30", end:"19:30", title:"Online Research Meeting with Nick and Dilara", type:"meet" }
];

const DAY_NAMES = ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const DAY_SHORT = ["", "MON", "TUE", "WED", "THU", "FRI"];
const START_H = 8, END_H = 20, HOUR_PX = 64;

function toMin(t) { const p = t.split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function fmt(t) { const p = t.split(":"); return parseInt(p[0], 10) + ":" + p[1]; }

const todayIdx = new Date().getDay();
const cal = document.getElementById("cal");
const totalH = (END_H - START_H) * HOUR_PX;

let html = '<div class="cal-head"></div>';
for (let d = 1; d <= 5; d++) html += '<div class="cal-head' + (d === todayIdx ? ' today' : '') + '">' + DAY_SHORT[d] + '</div>';

html += '<div class="time-col" style="height:' + totalH + 'px;">';
for (let h = START_H; h <= END_H; h++) html += '<div style="top:' + ((h - START_H) * HOUR_PX) + 'px;">' + h + ':00</div>';
html += '</div>';

for (let d = 1; d <= 5; d++) {
  const lines = 'background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ' + (HOUR_PX - 1) + 'px,rgba(201,168,76,0.15) ' + (HOUR_PX - 1) + 'px,rgba(201,168,76,0.15) ' + HOUR_PX + 'px);';
  html += '<div class="day-col' + (d === todayIdx ? ' today' : '') + '" style="height:' + totalH + 'px;' + lines + '">';
  EVENTS.filter(e => e.day === d).forEach(e => {
    const top = (toMin(e.start) - START_H * 60) / 60 * HOUR_PX;
    const h = (toMin(e.end) - toMin(e.start)) / 60 * HOUR_PX;
    html += '<div class="ev ' + e.type + '" style="top:' + top + 'px;height:' + (h - 2) + 'px;">' + e.title + '<small>' + fmt(e.start) + ' – ' + fmt(e.end) + '</small></div>';
  });
  html += '</div>';
}
cal.innerHTML = html;

let ag = "";
for (let d = 1; d <= 5; d++) {
  const list = EVENTS.filter(e => e.day === d).sort((a, b) => toMin(a.start) - toMin(b.start));
  if (!list.length) continue;
  ag += '<div class="agenda-day"><h3>' + DAY_NAMES[d] + '</h3>';
  list.forEach(e => {
    ag += '<div class="agenda-item ' + e.type + '"><span class="t">' + fmt(e.start) + ' – ' + fmt(e.end) + '</span><span>' + e.title + '</span></div>';
  });
  ag += '</div>';
}
document.getElementById("agenda").innerHTML = ag;
</script>

</body>
